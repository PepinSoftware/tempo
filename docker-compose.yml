version: "3.9"

services:
  timescaledb:
    image: timescale/timescaledb-ha:pg16-latest
    environment:
      POSTGRES_PASSWORD: tempo
      POSTGRES_USER: tempo
      POSTGRES_DB: tempo
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - timescale-data:/home/postgres/pgdata/data

volumes:
  timescale-data:
